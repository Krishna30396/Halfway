<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#1E2A24"/>
  <g transform="translate(256,240)">
    <!-- Route line -->
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#E9ECE4" stroke-width="6" stroke-linecap="round"/>
    <!-- Endpoint A -->
    <circle cx="-120" cy="0" r="16" fill="#E9ECE4" stroke="#1E2A24" stroke-width="4"/>
    <!-- Endpoint B -->
    <circle cx="120" cy="0" r="16" fill="#E9ECE4" stroke="#1E2A24" stroke-width="4"/>
    <!-- Midpoint diamond -->
    <rect x="-18" y="-18" width="36" height="36" rx="4" fill="#C51162" transform="rotate(45)" stroke="#fff" stroke-width="4"/>
  </g>
  <!-- HALFWAY text -->
  <text x="256" y="360" text-anchor="middle" fill="#E9ECE4" font-family="system-ui,sans-serif" font-weight="700" font-size="52" letter-spacing="8">HALFWAY</text>
</svg>
